  <script>
    /* 20260923 theme: 首屏前定主题，避免浅色用户看到一闪的深色 */
    (function () {
      try {
        var t = localStorage.getItem("wr-theme");
        if (t !== "light" && t !== "dark") {
          t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
  <style>
    /* ===== 20260923 加载页：六只手稿猫当加载动画（V3 上弧 + B 退场） ===== */
    #loading-cats { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 2; pointer-events: none; }
    .ld-cat { position: absolute; width: 28px; height: 28px; color: var(--ld-accent); opacity: .15;
      transform: translate(-50%, -50%) scale(.8);
      transition: opacity .5s ease, transform .5s cubic-bezier(.22, 1, .36, 1); }
    .ld-cat svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ld-cat.lit { opacity: .95; transform: translate(-50%, -50%) scale(1); }
    /* B：Start 出现前六只先退场，避开「整列重新居中把 WR 抬进猫的位置」 */
    #loading-cats.out .ld-cat { opacity: 0; transform: translate(-50%, -50%) scale(.55) translateY(-8px); transition-duration: .42s; }
    @media (prefers-reduced-motion: reduce) {
      .ld-cat, #loading-cats.out .ld-cat { transition: opacity .2s linear; transform: translate(-50%, -50%); }
    }
    :root, [data-theme="dark"] { --ld-bg: #0d0d0d; --ld-accent: var(--ld-accent); --ld-a: 183,171,152; }
    [data-theme="light"] { --ld-bg: #f2f3f5; --ld-accent: #7d6a45; --ld-a: 125,106,69; }
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--ld-bg); z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      cursor: auto;
    }
    #loading-inner {
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #loading-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #loading-logo {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.5rem; font-weight: 500;
      color: var(--ld-accent); letter-spacing: 3px;
      margin-bottom: 80px;
    }
    #loading-percent {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem; color: rgba(var(--ld-a),0.5);
      letter-spacing: 2px; margin-bottom: 24px;
    }
    #loading-start {
      background: transparent; border: 1px solid rgba(var(--ld-a),0.3);
      color: var(--ld-accent); padding: 12px 40px; border-radius: 4px;
      font-size: 0.8rem; font-family: "JetBrains Mono", monospace;
      letter-spacing: 3px; cursor: pointer; text-transform: uppercase;
      transition: all 0.3s;
    }
    #loading-start:hover {
      background: rgba(var(--ld-a),0.1); border-color: var(--ld-accent);
    }
    /* ===== 20260923 光标：深色＝红外红点／浅色＝羽毛逗猫棒 ＋ 手稿猫猫头（四态） ===== */
    #custom-cursor, #custom-cursor-follower {
      position: fixed; left: 0; top: 0; width: 0; height: 0;
      pointer-events: none; will-change: transform; opacity: 0;
      transition: opacity .25s ease;
      --cur-color: #D8E0E8; --cur-glow: rgba(216, 224, 232, .5);
    }
    [data-theme="light"] #custom-cursor, [data-theme="light"] #custom-cursor-follower {
      --cur-color: #33383D; --cur-glow: rgba(255, 255, 255, .55);
    }
    #custom-cursor { z-index: 10000000; }
    #custom-cursor-follower { z-index: 9999999; }
    .cur-in { position: absolute; left: 0; top: 0; transition: transform .28s cubic-bezier(.22, 1, .36, 1); }
    #custom-cursor-follower .cur-in.hov { transform: scale(1.32); }
    #custom-cursor .cur-in.hov { transform: scale(1.12); }
    .cur-svg { display: block; overflow: visible; color: var(--cur-color);
      filter: drop-shadow(0 0 6px var(--cur-glow)); }
    #custom-cursor.on, #custom-cursor-follower.on { opacity: 1; }
    .cat-face .eyes-squint, .cat-face .eyes-blink, .cat-face .eyes-droop,
    .cat-face .m-happy, .cat-face .m-scrunch { display: none; }
    .cat-face .blush { stroke: none; }
    .cat-face.squint .eyes-open, .cat-face.blink .eyes-open,
    .cat-face.pout .eyes-open, .cat-face.droop .eyes-open { display: none; }
    .cat-face.squint .eyes-squint, .cat-face.squint .m-happy,
    .cat-face.blink .eyes-blink, .cat-face.blink .m-scrunch,
    .cat-face.pout .eyes-blink, .cat-face.pout .m-scrunch,
    .cat-face.droop .eyes-droop { display: block; }
    .cat-face.squint .m-idle, .cat-face.blink .m-idle, .cat-face.pout .m-idle { display: none; }
    .cat-face.twitch .headcont { animation: catTwitch .55s ease-in-out 2; transform-box: fill-box; transform-origin: 50% 88%; }
    @keyframes catTwitch { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-3.4deg); } 65% { transform: rotate(2.6deg); } }
    @media (hover: none) and (pointer: coarse) {
      #custom-cursor, #custom-cursor-follower { display: none; }
    }
    #loading-rays {
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(var(--ld-a),0.08) 0deg 0.6deg, transparent 0.6deg 9deg);
      -webkit-mask: radial-gradient(circle at 50% 50%, #000 0%, transparent 60%);
      mask: radial-gradient(circle at 50% 50%, #000 0%, transparent 60%);
      animation: loadingSpin 90s linear infinite;
    }
    #loading-glow {
      position: absolute; top: 50%; left: 50%; width: 540px; height: 540px;
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(var(--ld-a),0.10) 0%, transparent 60%);
    }
    #loading-orbit {
      position: absolute; top: 50%; left: 50%; width: 312px; height: 312px;
      margin: -156px 0 0 -156px; border-radius: 50%; pointer-events: none;
      border: 1px dashed rgba(var(--ld-a),0.16);
      animation: loadingSpin 46s linear infinite reverse;
    }
    @keyframes loadingSpin { to { transform: rotate(360deg); } }
    #loading-inner { z-index: 1; }
    #loading-ring { filter: drop-shadow(0 0 6px rgba(var(--ld-a),0.25)); }
    #loading-logo { animation: logoBreath 3.2s ease-in-out infinite; }
    @keyframes logoBreath { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  /* JS 在才隐藏原生光标：脚本挂了不会出现「没有光标」的死状态 */
  @media (hover: hover) and (pointer: fine) {
    html.js-cursor, html.js-cursor * { cursor: none !important; }
  }
</style>

    <script>
    (function() {
      var circle = document.getElementById("loading-circle");
      var percent = document.getElementById("loading-percent");
      var startBtn = document.getElementById("loading-start");
      var screen = document.getElementById("loading-screen");
      var root = document.getElementById("root");
      var c = 2 * Math.PI * 132;
      circle.style.strokeDasharray = c;
      circle.style.strokeDashoffset = c;
      circle.style.transform = "rotate(-90deg)";
      circle.style.transformOrigin = "center";
      circle.style.transition = "stroke-dashoffset 0.1s linear";
      var catLayer = document.getElementById("loading-cats");
      var catEls = catLayer ? [].slice.call(catLayer.querySelectorAll(".ld-cat")) : [];
      var p = 0;
      var timer = setInterval(function() {
        p = Math.min(p + 5, 100);
        percent.textContent = p + "%";
        circle.style.strokeDashoffset = c - (p / 100) * c;
        for (var k = 0; k < catEls.length; k++) {
          catEls[k].classList.toggle("lit", p >= (k + 1) * 100 / catEls.length);
        }
        if (p >= 100) {
          clearInterval(timer);
          if (catLayer) catLayer.classList.add("out");
          setTimeout(function() { startBtn.style.display = ""; }, 460);
        }
      }, 100);
      startBtn.addEventListener("click", function() {
        screen.style.opacity = "0";
        screen.style.transition = "opacity 0.8s ease";
        setTimeout(function() {
          screen.style.display = "none";
          root.style.opacity = "1";
          root.style.transition = "opacity 0.8s ease";
        }, 800);
      });
    })();
      /* ===== 20260923 光标逻辑：红点／羽毛按主题切换，猫头四态＋扑点叼红点 ===== */
      var rootEl = document.documentElement;
      rootEl.classList.add("js-cursor");
      var wandEl = document.getElementById("custom-cursor");
      var catEl = document.getElementById("custom-cursor-follower");
      if (wandEl && catEl) {
        var wandIn = wandEl.firstElementChild, catIn = catEl.firstElementChild;
        var catSvg = catIn.querySelector("svg");
        var wDot = wandIn.querySelector(".w-dot"), wFeather = wandIn.querySelector(".w-feather");
        var eyesG = catSvg.querySelector(".eyes");
        var WAND_PX = 21, CAT_PX = 41;
        var LERP_W = 0.2, LERP_C = 0.04, LERP_POUNCE = 0.16;
        var HOT = { dot: [8, 8, 16], feather: [4.2, 4.2, 32] };
        var CAT_HOT = [20, 20, 40], MOUTH = [20.93, 29.74];
        var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (REDUCED) { LERP_W = 1; LERP_C = 1; LERP_POUNCE = 1; }
        catSvg.style.transformOrigin = "50% 50%";
        /* 猫头也要按热点对齐：svg 左上角要挪到 -hot×缩放，否则整只猫偏右下半个身子 */
        catIn.style.left = (-CAT_HOT[0] * CAT_PX / CAT_HOT[2]) + "px";
        catIn.style.top = (-CAT_HOT[1] * CAT_PX / CAT_HOT[2]) + "px";

        var HOT_SEL = "a,button,.project-card,.strength-card,.contact-method,.lang-toggle,.nav-cta,.lane-project,.capability-card";

          if (!REDUCED && eyesG) {
            var dx = cx - fx, dy = cy - fy, dist = Math.sqrt(dx * dx + dy * dy) || 1;
            var k = Math.min(dist / 45, 1);
            eyesG.setAttribute("transform", "translate(" + (dx / dist * 2.4 * k).toFixed(2) + " " + (dy / dist * 2.4 * k).toFixed(2) + ")");
            catSvg.style.transform = "rotate(" + (Math.max(-1, Math.min(1, dx / 55)) * 8 * k).toFixed(2) + "deg)";
          }
          if (!REDUCED && hovering) {
            var vx = cx - pcx; pcx = cx;
            sway += (Math.max(-15, Math.min(15, vx * 1.1)) - sway) * 0.16;
            (isLight ? wFeather : wDot).style.transform = "rotate(" + sway.toFixed(2) + "deg)";
          }
          wandEl.style.transform = "translate3d(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px,0)";
          catEl.style.transform = "translate3d(" + fx.toFixed(2) + "px," + fy.toFixed(2) + "px,0)";
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
  </script>
</body>
